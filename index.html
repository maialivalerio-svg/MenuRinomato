<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Menù</title>
  <!-- PDF.js per interpretare il PDF su qualsiasi browser mobile -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 8px 30px 8px;
    }
    #loading {
      color: #f0f0f0;
      margin-top: 50px;
      font-size: 1rem;
      text-align: center;
    }
    .page-card {
      margin-bottom: 12px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 650px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }
    .footer-bar {
      margin-top: 15px;
      text-align: center;
    }
    .btn-download {
      display: inline-block;
      background: #2a2a2a;
      color: #e0e0e0;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid #444444;
    }
  </style>
</head>
<body>

  <div id="loading">Caricamento menù in corso...</div>
  <div id="pdf-container"></div>

  <div class="footer-bar" id="footer-bar" style="display: none;">
    <a href="menu.pdf" download class="btn-download">Scarica copia PDF</a>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Aggiunge un parametro orario per forzare il download del file aggiornato ed evitare la cache
    const pdfUrl = 'menu.pdf?v=' + Date.now();
    const container = document.getElementById('pdf-container');
    const loading = document.getElementById('loading');
    const footerBar = document.getElementById('footer-bar');

    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      loading.style.display = 'none';
      footerBar.style.display = 'block';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);

        // Calcola la risoluzione per rendere il testo nitido su display mobile
        const pixelRatio = window.devicePixelRatio || 1;
        const baseViewport = page.getViewport({ scale: 1 });
        const targetWidth = Math.min(window.innerWidth - 16, 650);
        const scale = (targetWidth / baseViewport.width) * pixelRatio;
        const viewport = page.getViewport({ scale: scale });

        const card = document.createElement('div');
        card.className = 'page-card';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        card.appendChild(canvas);
        container.appendChild(card);

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;
      }
    }).catch((err) => {
      loading.innerHTML = 'Impossibile visualizzare il menù.<br><br><a href="menu.pdf" style="color: #66b3ff;">Apri il PDF direttamente</a>';
      console.error(err);
    });
  </script>
</body>
</html>
